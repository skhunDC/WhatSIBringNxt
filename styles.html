<style>
:root {
  --ink: #1f2a30;
  --muted: #68757d;
  --cream: #f8f3ea;
  --paper: #fffdf8;
  --brand: #123f5a;
  --brand-soft: #e6f0f3;
  --gold: #b98b4b;
  --line: rgba(31, 42, 48, 0.12);
  --shadow: 0 22px 70px rgba(18, 63, 90, 0.14);
  --radius: 28px;
  --tap: 72px;
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--cream); scroll-behavior: smooth; }
body { margin: 0; min-height: 100%; color: var(--ink); background: radial-gradient(circle at top right, #ffffff 0, var(--cream) 38rem); }
button, a { font: inherit; }

.loading-screen {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 2rem;
  background: linear-gradient(145deg, #fffdf8, #edf5f5);
  transition: opacity 520ms ease, visibility 520ms ease;
}
.loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-card { width: min(28rem, 92vw); padding: 3rem 2rem; text-align: center; background: rgba(255, 253, 248, 0.9); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.loading-logo { width: min(13rem, 70vw); height: auto; margin-bottom: 1.4rem; }
.loading-card p { margin: 0 0 1rem; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.35rem); }
.countdown { width: 3.25rem; height: 3.25rem; margin: 0 auto; display: grid; place-items: center; color: var(--brand); border: 1px solid var(--line); border-radius: 50%; background: #fff; font-weight: 800; }

.app-shell { width: min(72rem, 100%); margin: 0 auto; padding: clamp(1rem, 3vw, 2.4rem); }
.hero { min-height: min(55rem, 100svh); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(16rem, 0.8fr); gap: clamp(1rem, 4vw, 3rem); align-items: center; padding: clamp(1.2rem, 4vw, 3rem) 0; }
.eyebrow, .mini-label { margin: 0 0 0.75rem; color: var(--gold); font-size: 0.82rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 8vw, 6.8rem); line-height: 0.9; letter-spacing: -0.06em; }
h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -0.04em; }
h3 { margin: 0 0 1rem; font-size: clamp(1.1rem, 2.2vw, 1.35rem); }
.supporting { max-width: 38rem; margin: 1.3rem 0 1.7rem; color: var(--muted); font-size: clamp(1.25rem, 3vw, 1.75rem); line-height: 1.35; }
.primary-cta, .secondary-button, .ghost-button { min-height: var(--tap); display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid transparent; text-decoration: none; cursor: pointer; transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease; }
.primary-cta { padding: 0 2rem; color: #fff; background: var(--brand); font-weight: 800; box-shadow: 0 16px 35px rgba(18, 63, 90, 0.22); }
.primary-cta:active, .secondary-button:active, .ghost-button:active, .situation-card:active { transform: scale(0.98); }
.hero-anchor { display: grid; place-items: center; }
.anchor-card { min-height: 25rem; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.8rem; padding: 2rem; color: #fff; background: linear-gradient(160deg, var(--brand), #467184); border-radius: var(--radius); box-shadow: var(--shadow); }
.anchor-icon { width: 5rem; height: 5rem; display: grid; place-items: center; margin-bottom: auto; color: var(--gold); background: rgba(255,255,255,0.96); border-radius: 50%; font-size: 2rem; }
.anchor-card strong { font-size: 1.8rem; }
.anchor-card span:last-child { color: rgba(255,255,255,0.82); font-size: 1.08rem; line-height: 1.45; }

.situations { padding: 1rem 0 3rem; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.3rem; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(0.9rem, 2vw, 1.25rem); }
.situation-card { min-height: 10.5rem; padding: 1.35rem; text-align: left; color: var(--ink); background: rgba(255, 253, 248, 0.86); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 12px 34px rgba(31, 42, 48, 0.07); cursor: pointer; transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
.situation-card:hover, .situation-card:focus-visible { border-color: rgba(185, 139, 75, 0.55); box-shadow: var(--shadow); transform: translateY(-2px); outline: none; }
.situation-icon { width: 3.4rem; height: 3.4rem; display: grid; place-items: center; margin-bottom: 1.1rem; color: var(--brand); background: var(--brand-soft); border-radius: 50%; font-size: 1.45rem; font-weight: 900; }
.situation-card strong { display: block; font-size: clamp(1.25rem, 2.6vw, 1.65rem); }
.situation-card span { display: block; margin-top: 0.45rem; color: var(--muted); line-height: 1.35; }

.result-panel { padding: 1rem 0 3rem; animation: panelIn 240ms ease both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.panel-topline { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.ghost-button { min-height: 3.5rem; padding: 0 1.1rem; color: var(--brand); background: transparent; border-color: var(--line); font-weight: 800; }
.panel-badge { color: var(--gold); font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
.result-card { padding: clamp(1rem, 3vw, 2rem); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.result-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.6rem 0; }
.list-block { padding: 1.3rem; background: #fff; border: 1px solid var(--line); border-radius: 22px; }
ul { margin: 0; padding-left: 1.25rem; }
li { margin: 0.58rem 0; font-size: clamp(1.06rem, 2vw, 1.26rem); }
.premium-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.premium-row > div, .save-area { padding: 1.25rem; background: var(--brand-soft); border-radius: 22px; }
.premium-row strong { display: block; font-size: clamp(1.1rem, 2vw, 1.38rem); line-height: 1.3; }
.save-area { display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: #fbf7ef; border: 1px dashed rgba(185, 139, 75, 0.45); }
.save-area p { margin: 0; color: var(--muted); }
.secondary-button { min-width: 11rem; padding: 0 1.2rem; color: var(--brand); background: #fff; border-color: var(--line); font-weight: 850; }

.print-shell { width: min(48rem, 100%); margin: 0 auto; padding: 2rem; }
.print-logo { width: 11rem; }
.print-list { display: grid; gap: 1rem; margin-top: 2rem; }
.print-list .situation-card { cursor: default; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; min-height: auto; }
  .anchor-card { min-height: 16rem; }
  .card-grid, .result-columns, .premium-row { grid-template-columns: 1fr; }
  .section-heading, .panel-topline, .save-area { align-items: stretch; flex-direction: column; }
  .primary-cta, .secondary-button, .ghost-button { width: 100%; }
}

@media (orientation: portrait) and (min-width: 760px) {
  .app-shell { max-width: 58rem; }
  .hero { grid-template-columns: 1fr; min-height: 50svh; }
  .anchor-card { min-height: 13rem; }
}

@media print {
  .loading-screen, .primary-cta, .ghost-button, .secondary-button { display: none !important; }
  body { background: #fff; }
  .situation-card, .result-card { box-shadow: none; }
}
</style>

<style>
:root {
  --ink: #1f2a30;
  --muted: #65747d;
  --cream: #f7efe2;
  --paper: #fffdf8;
  --brand: #123f5a;
  --brand-deep: #082b40;
  --brand-soft: #e8f1f1;
  --gold: #b98b4b;
  --gold-soft: #f2e4cd;
  --selected: #0f4c6a;
  --line: rgba(31, 42, 48, 0.14);
  --shadow: 0 24px 70px rgba(18, 63, 90, 0.16);
  --radius: 34px;
  --tap: 72px;
  --kiosk-width: 1080px;
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html {
  min-height: 100%;
  background: #d9e2df;
  scroll-behavior: auto;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.7), transparent 36rem),
    linear-gradient(180deg, #dfe8e5 0%, #cddad6 100%);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; touch-action: manipulation; }
button, img { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { overflow-wrap: anywhere; }

.kiosk-shell {
  position: relative;
  width: min(var(--kiosk-width), 100vw);
  min-height: 100vh;
  min-height: 100svh;
  max-width: var(--kiosk-width);
  margin: 0 auto;
  display: grid;
  grid-template-rows: 20svh 55svh 25svh;
  gap: clamp(14px, 1.6vw, 24px);
  padding: clamp(22px, 3vw, 48px);
  background:
    linear-gradient(180deg, rgba(255,253,248,0.98), rgba(248,243,234,0.98)),
    var(--cream);
  box-shadow: 0 0 0 1px rgba(8, 43, 64, 0.08), 0 30px 90px rgba(8, 43, 64, 0.22);
  overflow: hidden;
}

.loading-pill {
  position: absolute;
  top: clamp(18px, 2vw, 30px);
  right: clamp(22px, 3vw, 48px);
  z-index: 5;
  min-height: var(--tap);
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 0 24px;
  color: var(--brand);
  background: rgba(255, 253, 248, 0.94);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: 0 12px 30px rgba(31, 42, 48, 0.09);
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 850;
  transition: opacity 420ms ease, transform 420ms ease, visibility 420ms ease;
}
.loading-pill.is-hidden { opacity: 0; visibility: hidden; transform: translateY(-10px); pointer-events: none; }
.loading-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--gold);
  animation: loadingFade 1.1s ease-in-out infinite alternate;
}
@keyframes loadingFade { from { opacity: 0.35; } to { opacity: 1; } }

.kiosk-hero {
  display: flex;
  min-height: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 clamp(20px, 4vw, 46px);
}
.brand-logo {
  width: clamp(180px, 28vw, 270px);
  height: auto;
  max-height: 42%;
  object-fit: contain;
  margin-bottom: clamp(8px, 1.2vw, 18px);
}
.eyebrow, .mini-label {
  margin: 0 0 8px;
  color: var(--gold);
  font-size: clamp(15px, 1.55vw, 22px);
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(46px, 7vw, 84px);
  line-height: 0.95;
  letter-spacing: -0.055em;
}
h2 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(34px, 4.6vw, 58px);
  line-height: 1;
  letter-spacing: -0.035em;
}
h3 {
  margin: 0 0 10px;
  color: var(--brand-deep);
  font-size: clamp(20px, 2.2vw, 28px);
  line-height: 1.1;
}
.supporting {
  margin: clamp(10px, 1.6vw, 20px) 0 0;
  color: var(--muted);
  font-size: clamp(25px, 3vw, 38px);
  line-height: 1.2;
  font-weight: 650;
}

.kiosk-situations {
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.section-heading {
  flex: 0 0 auto;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: clamp(16px, 2vw, 26px);
}
.card-grid {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: clamp(18px, 2.2vw, 30px);
}
.situation-card {
  position: relative;
  min-height: var(--tap);
  display: grid;
  grid-template-rows: auto auto 1fr;
  align-content: center;
  gap: clamp(8px, 1vw, 14px);
  padding: clamp(20px, 2.7vw, 34px);
  text-align: left;
  color: var(--ink);
  background: rgba(255, 253, 248, 0.94);
  border: 4px solid transparent;
  border-radius: var(--radius);
  box-shadow: 0 12px 34px rgba(31, 42, 48, 0.08);
  cursor: pointer;
  transition: transform 140ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
}
.situation-card:active { transform: scale(0.985); }
.situation-card:focus-visible {
  outline: 6px solid rgba(185, 139, 75, 0.34);
  outline-offset: 4px;
}
.situation-card.is-selected {
  color: #fff;
  background: linear-gradient(145deg, var(--selected), var(--brand-deep));
  border-color: var(--gold);
  box-shadow: var(--shadow);
}
.situation-icon {
  width: clamp(58px, 7.4vw, 86px);
  height: clamp(58px, 7.4vw, 86px);
  display: grid;
  place-items: center;
  color: var(--brand);
  background: var(--brand-soft);
  border-radius: 50%;
  font-size: clamp(27px, 3.2vw, 42px);
  font-weight: 950;
}
.situation-card.is-selected .situation-icon { color: var(--brand-deep); background: #fff; }
.situation-card strong {
  display: block;
  font-size: clamp(25px, 3.1vw, 38px);
  line-height: 1.05;
}
.situation-card span:last-child {
  display: block;
  color: var(--muted);
  font-size: clamp(18px, 2vw, 25px);
  line-height: 1.22;
}
.situation-card.is-selected span:last-child { color: rgba(255,255,255,0.82); }

.result-panel {
  min-height: 0;
}
.result-card {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    "copy lists"
    "actions lists";
  gap: clamp(14px, 1.7vw, 24px);
  padding: clamp(18px, 2.5vw, 30px);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform 220ms ease, opacity 220ms ease;
}
.result-card.has-result { animation: panelIn 220ms ease both; }
@keyframes panelIn { from { opacity: 0.72; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.result-copy { grid-area: copy; }
.checklist-columns { grid-area: lists; }
.result-actions { grid-area: actions; }
.result-copy, .result-actions, .list-block, .save-card, .next-step-card {
  min-height: 0;
}
.result-helper {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: clamp(18px, 2vw, 25px);
  line-height: 1.25;
}
.checklist-columns {
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(12px, 1.5vw, 20px);
}
.list-block {
  padding: clamp(14px, 1.8vw, 22px);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
}
ul { margin: 0; padding-left: 1.2em; }
li {
  margin: 0.28em 0;
  font-size: clamp(17px, 1.8vw, 24px);
  line-height: 1.13;
}
.result-actions {
  display: grid;
  grid-template-rows: 1fr 1fr auto;
  gap: clamp(10px, 1.4vw, 18px);
}
.save-card, .next-step-card {
  display: flex;
  align-items: center;
  gap: clamp(10px, 1.4vw, 16px);
  padding: clamp(12px, 1.7vw, 20px);
  background: var(--brand-soft);
  border-radius: 24px;
}
.save-card { background: #fbf6ec; border: 2px dashed rgba(185, 139, 75, 0.5); }
.save-card p, .next-step-card small {
  display: block;
  margin: 0;
  color: var(--muted);
  font-size: clamp(15px, 1.55vw, 20px);
  line-height: 1.2;
}
.next-step-card {
  display: block;
}
.next-step-card strong {
  display: block;
  color: var(--brand-deep);
  font-size: clamp(18px, 1.9vw, 24px);
  line-height: 1.15;
}
.qr-mark {
  flex: 0 0 auto;
  width: clamp(76px, 8vw, 104px);
  height: clamp(76px, 8vw, 104px);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
}
.qr-mark span { background: var(--brand-deep); border-radius: 6px; }
.qr-mark span:nth-child(2), .qr-mark span:nth-child(3) { opacity: 0.45; }
.reset-button {
  min-height: var(--tap);
  width: 100%;
  padding: 0 18px;
  color: #fff;
  background: var(--brand);
  border: 0;
  border-radius: 999px;
  font-size: clamp(19px, 2vw, 25px);
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 14px 30px rgba(18, 63, 90, 0.22);
  transition: transform 140ms ease, background 160ms ease;
}
.reset-button:active { transform: scale(0.985); background: var(--brand-deep); }
.reset-button:focus-visible { outline: 6px solid rgba(185, 139, 75, 0.34); outline-offset: 4px; }

.print-shell { width: min(48rem, 100%); margin: 0 auto; padding: 2rem; }
.print-logo { width: 11rem; }
.print-list { display: grid; gap: 1rem; margin-top: 2rem; }
.print-list .situation-card { cursor: default; }

@media (max-width: 700px) {
  body { user-select: auto; -webkit-user-select: auto; }
  .kiosk-shell {
    min-height: 100vh;
    min-height: 100svh;
    grid-template-rows: auto auto auto;
    overflow: visible;
  }
  .loading-pill { left: 18px; right: 18px; justify-content: center; }
  .kiosk-hero { padding-top: 88px; }
  .card-grid { grid-template-columns: 1fr; grid-template-rows: none; }
  .situation-card { min-height: 150px; }
  .result-card, .checklist-columns { grid-template-columns: 1fr; }
  .result-card { height: auto; grid-template-areas: none; }
  .result-copy, .checklist-columns, .result-actions { grid-area: auto; }
}

@media (min-width: 1200px) {
  body {
    display: grid;
    place-items: start center;
  }
  .kiosk-shell { width: var(--kiosk-width); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 1ms !important;
  }
}

@media print {
  .loading-pill, .reset-button { display: none !important; }
  body { background: #fff; user-select: auto; }
  .kiosk-shell { display: block; width: 100%; min-height: auto; box-shadow: none; overflow: visible; }
  .situation-card, .result-card { box-shadow: none; }
}
</style>

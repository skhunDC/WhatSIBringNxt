<script>
(function() {
  'use strict';

  var FALLBACK_PAYLOAD = {
    appName: 'What Should I Bring Next?',
    businessName: 'Dublin Cleaners',
    established: '1934',
    logoUrl: 'https://www.dublincleaners.com/wp-content/uploads/2024/12/Dublin-Logos-stacked.png',
    categories: [
      { id: 'wedding_event', title: 'Wedding / Event', icon: '✦', helperText: 'Formal pieces before the big day.', selectedItems: ['Suits', 'Dress shirts', 'Ties', 'Formal dresses', 'Wraps or shawls'], forgottenItems: ['Pocket squares', 'Dress pants with the matching jacket', 'Garment bags that need replacing'], smartAddOn: 'Alterations or professional pressing', nextStep: 'Ask us today if you need it ready before the weekend.' },
      { id: 'spring_closet_reset', title: 'Spring Closet Reset', icon: '☼', helperText: 'Freshen seasonal favorites.', selectedItems: ['Winter coats', 'Wool sweaters', 'Scarves', 'Comforters', 'Table linens'], forgottenItems: ['Pillow shams', 'Mattress pads', 'Light blankets'], smartAddOn: 'Coat cleaning and seasonal storage', nextStep: 'Ask us about household items before you switch seasons.' },
      { id: 'guest_room_refresh', title: 'Guest Room Refresh', icon: '⌂', helperText: 'Make linens guest-ready.', selectedItems: ['Comforters', 'Blankets', 'Bedspreads', 'Shams', 'Decorative pillows'], forgottenItems: ['Mattress pads', 'Table runners', 'Guest towels needing brightening'], smartAddOn: 'Comforters and household textile care', nextStep: 'Bring household items in before guests arrive.' },
      { id: 'traveling_soon', title: 'Traveling Soonish', icon: '✈', helperText: 'Pack clean and pressed.', selectedItems: ['Vacation outfits', 'Resort wear', 'Jackets', 'Dress clothes', 'Travel laundry'], forgottenItems: ['Hats', 'Scarves', 'Packing pieces that need pressing'], smartAddOn: 'Rush service or professional pressing', nextStep: 'Ask what to clean first if you’re leaving soon.' },
      { id: 'stain_emergency', title: 'Stain Emergency', icon: '!', helperText: 'Bring stains in fast.', selectedItems: ['Stained shirts', 'Dresses', 'Table linens', 'Jackets', 'Specialty fabrics'], forgottenItems: ['Napkins', 'Matching pieces', 'Items they tried to spot-clean at home'], smartAddOn: 'Specialty stain treatment', nextStep: 'Bring it in today and don’t apply heat.' },
      { id: 'laundry_overload', title: 'Laundry Overload', icon: '∞', helperText: 'Take the week back.', selectedItems: ['Everyday laundry', 'Kids’ clothes', 'Bedding', 'Towels', 'Workwear'], forgottenItems: ['Socks and basics', 'Gym clothes', 'Extra household loads'], smartAddOn: 'Wash and fold', nextStep: 'Ask about wash and fold if you want your week back.' }
    ]
  };

  var state = {
    payload: FALLBACK_PAYLOAD,
    selectedCategoryId: '',
    inactivityTimer: 0,
    loadingLogged: false,
    reminderSubmitting: false
  };

  function clampNumber(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function getViewportMetrics() {
    var visualViewport = window.visualViewport || {};
    var width = Math.round(visualViewport.width || window.innerWidth || document.documentElement.clientWidth || 0);
    var height = Math.round(visualViewport.height || window.innerHeight || document.documentElement.clientHeight || 0);
    var screenWidth = window.screen && window.screen.width ? Math.round(window.screen.width) : width;
    var screenHeight = window.screen && window.screen.height ? Math.round(window.screen.height) : height;
    var orientation = width <= height ? 'portrait' : 'landscape';
    var shortSide = Math.min(width, height);
    var longSide = Math.max(width, height);

    return {
      width: width,
      height: height,
      screenWidth: screenWidth,
      screenHeight: screenHeight,
      orientation: orientation,
      shortSide: shortSide,
      longSide: longSide,
      pixelRatio: window.devicePixelRatio || 1
    };
  }

  function getPointerProfile() {
    return {
      coarse: window.matchMedia("(pointer: coarse)").matches,
      fine: window.matchMedia("(pointer: fine)").matches,
      touch: navigator.maxTouchPoints > 0,
      hoverless: window.matchMedia("(hover: none)").matches
    };
  }

  function classifyDevice(metrics, pointerProfile) {
    var userAgent = navigator.userAgent || '';
    var looksPhone = /Android.*Mobile|iPhone|iPod|Mobile/i.test(userAgent);
    var looksTablet = /iPad|Tablet|Android(?!.*Mobile)/i.test(userAgent);
    var isPortrait = metrics.orientation === 'portrait';
    var isKioskResolution = isPortrait && metrics.width >= 700 && metrics.height >= 1100;
    var isPhoneSize = metrics.shortSide <= 700 || looksPhone;
    var isTabletSize = metrics.shortSide > 700 && metrics.shortSide <= 1024 && (pointerProfile.touch || looksTablet);

    if (isPhoneSize) {
      return { mode: 'mobile', deviceType: 'phone' };
    }

    if (isKioskResolution && (pointerProfile.coarse || pointerProfile.touch || !pointerProfile.fine || metrics.longSide >= 1600)) {
      return { mode: 'kiosk', deviceType: isTabletSize ? 'tablet' : 'kiosk' };
    }

    if (isTabletSize && isPortrait) {
      return { mode: 'kiosk', deviceType: 'tablet' };
    }

    return { mode: 'desktop', deviceType: looksTablet ? 'tablet' : 'desktop' };
  }

  function calculateDisplayScale(metrics, mode) {
    var scale;
    if (mode === 'mobile') {
      scale = Math.min(metrics.width / 390, metrics.height / 844);
      return clampNumber(scale, 0.88, 1.08);
    }

    scale = Math.min(metrics.width / 1080, metrics.height / 1920);
    if (mode === 'desktop' && metrics.orientation === 'landscape') {
      scale = Math.min(metrics.width / 1080, (metrics.height - 48) / 1920);
    }
    return clampNumber(scale, 0.72, 1.12);
  }

  function applyResponsiveViewport() {
    var metrics = getViewportMetrics();
    var pointerProfile = getPointerProfile();
    var classification = classifyDevice(metrics, pointerProfile);
    var scale = calculateDisplayScale(metrics, classification.mode);
    var rootStyle = document.documentElement.style;
    var body = document.body;

    rootStyle.setProperty('--viewport-width', metrics.width + 'px');
    rootStyle.setProperty('--viewport-height', metrics.height + 'px');
    rootStyle.setProperty('--display-scale', scale.toFixed(3));

    if (body) {
      body.classList.remove('mode-kiosk', 'mode-mobile', 'mode-desktop', 'density-compact', 'density-roomy');
      body.classList.add('mode-' + classification.mode);
      body.classList.add(metrics.height < 820 || scale < 0.82 ? 'density-compact' : 'density-roomy');
      body.dataset.displayMode = classification.mode;
      body.dataset.deviceType = classification.deviceType;
      body.dataset.viewportWidth = String(metrics.width);
      body.dataset.viewportHeight = String(metrics.height);
      body.dataset.screenResolution = metrics.screenWidth + 'x' + metrics.screenHeight;
      body.dataset.pixelRatio = String(metrics.pixelRatio);
    }

    return {
      mode: classification.mode,
      deviceType: classification.deviceType,
      metrics: metrics
    };
  }

  function detectDisplayMode() {
    return applyResponsiveViewport().mode;
  }

  function scheduleViewportRefresh() {
    window.requestAnimationFrame(applyResponsiveViewport);
  }

  window.detectDisplayMode = detectDisplayMode;
  window.applyResponsiveViewport = applyResponsiveViewport;
  applyResponsiveViewport();
  window.addEventListener("resize", scheduleViewportRefresh);
  window.addEventListener("orientationchange", scheduleViewportRefresh);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", scheduleViewportRefresh);
  }
  document.addEventListener("DOMContentLoaded", applyResponsiveViewport);

  function byId(id) {
    return document.getElementById(id);
  }

  function setText(node, value) {
    if (node) {
      node.textContent = value || '';
    }
  }

  function clearNode(node) {
    while (node && node.firstChild) {
      node.removeChild(node.firstChild);
    }
  }

  function makeRequest(action, category) {
    var responsiveState = applyResponsiveViewport();
    var metrics = responsiveState.metrics;
    var orientation = metrics.orientation;
    return {
      action: action,
      category: category || '',
      sessionId: getSessionId(),
      deviceLabel: window.localStorage.getItem('dublinCleanersDeviceLabel') || responsiveState.deviceType + ' ' + metrics.screenWidth + 'x' + metrics.screenHeight,
      displayMode: responsiveState.mode,
      userAgent: window.navigator.userAgent || '',
      viewportWidth: metrics.width || '',
      viewportHeight: metrics.height || '',
      orientation: orientation,
      touchCapable: navigator.maxTouchPoints > 0,
      referrer: document.referrer || ''
    };
  }

  function enqueueLog(action, category) {
    window.setTimeout(function() {
      if (!window.google || !google.script || !google.script.run) {
        return;
      }
      google.script.run
        .withFailureHandler(function() {})
        .recordAppAction(makeRequest(action, category));
    }, 0);
  }

  function logAction(action, category) {
    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(function() { enqueueLog(action, category); }, { timeout: 1500 });
      return;
    }
    enqueueLog(action, category);
  }


  function getSelectedCategory() {
    return state.payload.categories.find(function(item) {
      return item.id === state.selectedCategoryId;
    }) || null;
  }

  function setReminderStatus(message, type) {
    var status = byId('reminderStatus');
    if (!status) {
      return;
    }
    status.textContent = message || '';
    status.dataset.status = type || '';
  }

  function clearReminderEmail() {
    var email = byId('reminderEmail');
    if (email) {
      email.value = '';
    }
  }

  function closeReminderForm() {
    var form = byId('reminderForm');
    var openButton = byId('openReminderButton');
    if (form) {
      form.hidden = true;
    }
    if (openButton && state.selectedCategoryId) {
      openButton.hidden = false;
    }
    state.reminderSubmitting = false;
    setReminderStatus('', '');
    clearReminderEmail();
  }

  function openReminderForm() {
    var form = byId('reminderForm');
    var openButton = byId('openReminderButton');
    var email = byId('reminderEmail');
    if (!state.selectedCategoryId || !form) {
      return;
    }
    form.hidden = false;
    if (openButton) {
      openButton.hidden = true;
    }
    setReminderStatus('', '');
    if (email) {
      email.focus();
    }
    resetInactivityTimer();
  }

  function getSelectedReminderDate() {
    var selected = document.querySelector('input[name="reminderDate"]:checked');
    return selected ? selected.value : 'tomorrow';
  }

  function setReminderSubmitting(isSubmitting) {
    var submitButton = document.querySelector('.reminder-submit-button');
    state.reminderSubmitting = isSubmitting;
    if (submitButton) {
      submitButton.disabled = isSubmitting;
      submitButton.textContent = isSubmitting ? 'Sending…' : 'Send calendar invite';
    }
  }

  function handleReminderFailure(error) {
    setReminderSubmitting(false);
    var message = error && String(error.message || error).indexOf('INVALID_EMAIL') !== -1
      ? 'Please enter a valid email address.'
      : 'We couldn’t send the reminder. Please try again.';
    setReminderStatus(message, 'error');
  }

  function submitReminder(event) {
    event.preventDefault();
    if (state.reminderSubmitting) {
      return;
    }

    var category = getSelectedCategory();
    var emailInput = byId('reminderEmail');
    var email = emailInput ? emailInput.value : '';
    if (!category) {
      closeReminderForm();
      return;
    }
    if (!email) {
      setReminderStatus('Please enter a valid email address.', 'error');
      if (emailInput) {
        emailInput.focus();
      }
      return;
    }
    if (!window.google || !google.script || !google.script.run) {
      setReminderStatus('We couldn’t send the reminder. Please try again.', 'error');
      return;
    }

    setReminderSubmitting(true);
    setReminderStatus('Sending your calendar invite…', 'pending');
    google.script.run
      .withSuccessHandler(function(response) {
        setReminderSubmitting(false);
        if (!response || response.ok !== true) {
          setReminderStatus('We couldn’t send the reminder. Please try again.', 'error');
          return;
        }
        clearReminderEmail();
        setReminderStatus('Reminder sent. Please check your email for the calendar invite.', 'success');
        window.setTimeout(function() {
          closeReminderForm();
        }, 2200);
      })
      .withFailureHandler(handleReminderFailure)
      .sendChecklistReminder({
        email: email,
        category: category.id,
        reminderDate: getSelectedReminderDate(),
        sessionId: getSessionId()
      });
    resetInactivityTimer();
  }

  function resetInactivityTimer() {
    if (state.inactivityTimer) {
      window.clearTimeout(state.inactivityTimer);
    }
    state.inactivityTimer = window.setTimeout(function() {
      if (state.selectedCategoryId) {
        resetResult('inactivity_reset');
      }
    }, 120000);
  }

  function renderCategories(categories) {
    var grid = byId('categoryGrid');
    var printGrid = byId('printCategories');
    var target = grid || printGrid;
    if (!target) {
      return;
    }
    clearNode(target);
    categories.forEach(function(category) {
      var card = document.createElement(grid ? 'button' : 'article');
      card.className = 'situation-card';
      card.dataset.categoryId = category.id;
      if (state.selectedCategoryId === category.id) {
        card.classList.add('is-selected');
        card.setAttribute('aria-pressed', 'true');
      } else if (grid) {
        card.setAttribute('aria-pressed', 'false');
      }
      if (grid) {
        card.type = 'button';
        card.setAttribute('aria-label', 'Show checklist for ' + category.title);
        card.addEventListener('click', function() {
          showCategory(category.id);
        });
      }

      var icon = document.createElement('span');
      icon.className = 'situation-icon';
      icon.textContent = category.icon;

      var title = document.createElement('strong');
      title.textContent = category.title;

      var hint = document.createElement('span');
      hint.textContent = category.helperText || category.selectedItems.slice(0, 3).join(' · ');

      card.appendChild(icon);
      card.appendChild(title);
      card.appendChild(hint);
      target.appendChild(card);
    });
  }

  function renderList(id, items) {
    var list = byId(id);
    clearNode(list);
    items.forEach(function(item) {
      var li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
  }

  function updateSelectedCards(categoryId) {
    var cards = document.querySelectorAll('.situation-card[data-category-id]');
    Array.prototype.forEach.call(cards, function(card) {
      var selected = card.dataset.categoryId === categoryId;
      card.classList.toggle('is-selected', selected);
      if (card.tagName === 'BUTTON') {
        card.setAttribute('aria-pressed', selected ? 'true' : 'false');
      }
    });
  }

  function revealResultPanel() {
    var panel = byId('resultPanel');
    if (!panel || !panel.scrollIntoView) {
      return;
    }

    window.requestAnimationFrame(function() {
      var mode = document.body.dataset.displayMode || detectDisplayMode();
      var width = window.innerWidth;
      var viewportHeight = window.innerHeight;
      var rect = panel.getBoundingClientRect();
      var panelIsClipped = rect.top < 0 || rect.bottom > viewportHeight;
      var shouldScroll = mode === 'mobile' || width <= 700 || panelIsClipped;

      if (shouldScroll) {
        panel.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }
    });
  }

  function scrollToPageTop() {
    window.requestAnimationFrame(function() {
      if (window.scrollTo) {
        window.scrollTo({
          top: 0,
          left: 0,
          behavior: 'smooth'
        });
      }

      var appShell = byId('appShell');
      if (appShell && appShell.scrollTo) {
        appShell.scrollTo({
          top: 0,
          left: 0,
          behavior: 'smooth'
        });
      }
    });
  }

  function showCategory(categoryId) {
    var category = state.payload.categories.find(function(item) {
      return item.id === categoryId;
    });
    if (!category) {
      return;
    }

    state.selectedCategoryId = category.id;
    closeReminderForm();
    updateSelectedCards(category.id);
    setText(byId('resultEyebrow'), 'Selected situation');
    setText(byId('resultTitle'), category.title);
    setText(byId('resultHelper'), category.helperText || 'Here is your quick checklist.');
    setText(byId('smartAddOn'), 'Smart add-on: ' + category.smartAddOn);
    setText(byId('nextStep'), category.nextStep);
    setText(byId('saveCopy'), 'Snap a photo of this ' + category.title + ' checklist before you leave.');
    renderList('selectedItems', category.selectedItems);
    renderList('forgottenItems', category.forgottenItems);

    byId('checklistColumns').hidden = false;
    byId('openReminderButton').hidden = false;
    byId('resultCard').classList.remove('is-empty');
    byId('resultCard').classList.add('has-result');
    revealResultPanel();
    logAction('category_selected', category.id);
    logAction('checklist_viewed', category.id);
    resetInactivityTimer();
  }

  function resetResult(reason) {
    var previousCategoryId = state.selectedCategoryId;
    state.selectedCategoryId = '';
    updateSelectedCards('');
    setText(byId('resultEyebrow'), 'Ready when you are');
    setText(byId('resultTitle'), 'Your quick checklist appears here.');
    setText(byId('resultHelper'), 'Tap any card above. The list updates instantly with what to bring, what customers forget, and the best next step.');
    setText(byId('nextStep'), 'Pick a situation to see your counter-ready reminder.');
    setText(byId('smartAddOn'), 'No form fields. No keyboard needed.');
    setText(byId('saveCopy'), 'Snap a photo of this panel before you leave.');
    clearNode(byId('selectedItems'));
    clearNode(byId('forgottenItems'));
    byId('checklistColumns').hidden = true;
    byId('openReminderButton').hidden = true;
    closeReminderForm();
    byId('resultCard').classList.add('is-empty');
    byId('resultCard').classList.remove('has-result');
    if (reason && previousCategoryId) {
      logAction(reason, previousCategoryId);
    }
  }

  function setupControls() {
    var backButton = byId('backButton');
    if (backButton) {
      backButton.addEventListener('click', function() {
        resetResult('reset_tapped');
        scrollToPageTop();
        resetInactivityTimer();
      });
    }

    var saveButton = byId('saveListButton');
    if (saveButton) {
      saveButton.addEventListener('click', function() {
        logAction('save_list_opened', state.selectedCategoryId);
        resetInactivityTimer();
      });
    }


    var openReminderButton = byId('openReminderButton');
    if (openReminderButton) {
      openReminderButton.addEventListener('click', openReminderForm);
    }

    var cancelReminderButton = byId('cancelReminderButton');
    if (cancelReminderButton) {
      cancelReminderButton.addEventListener('click', function() {
        closeReminderForm();
        resetInactivityTimer();
      });
    }

    var reminderForm = byId('reminderForm');
    if (reminderForm) {
      reminderForm.addEventListener('submit', submitReminder);
    }
  }

  function hideLoader() {
    var loadingScreen = byId('loadingScreen');
    if (loadingScreen) {
      loadingScreen.classList.add('is-hidden');
      window.setTimeout(function() {
        loadingScreen.setAttribute('aria-hidden', 'true');
        if (!state.loadingLogged) {
          state.loadingLogged = true;
          logAction('loading_complete', '');
        }
      }, 440);
    }
  }

  function hydrateAfterPaint() {
    window.requestAnimationFrame(function() {
      renderCategories(state.payload.categories);
      setupControls();
      hideLoader();
      logAction('app_loaded', '');
      resetInactivityTimer();

      if (!window.google || !google.script || !google.script.run) {
        return;
      }
      google.script.run
        .withSuccessHandler(function(payload) {
          state.payload = payload || FALLBACK_PAYLOAD;
          renderCategories(state.payload.categories);
          if (state.selectedCategoryId) {
            showCategory(state.selectedCategoryId);
          }
        })
        .withFailureHandler(function() {
          hideLoader();
        })
        .getAppPayload();
    });
  }

  document.addEventListener('DOMContentLoaded', hydrateAfterPaint);
}());
</script>
